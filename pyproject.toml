[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vllm-hust-unified-comm"
version = "0.2.0.dev0"
description = "Mountable unified communication provider MOD for vLLM-HUST"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12", "vllm-hust-ext>=0.3.1.dev1,<0.4"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.unified-communication" = "vllm_hust_unified_comm"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_hust_unified_comm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
