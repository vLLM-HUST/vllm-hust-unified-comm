name: Custody policy tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  policy-tests:
    name: Custody policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vLLM-HUST/.github
          ref: eb9fe29998089ae76a6c83df70506c73a060a6c0
          persist-credentials: false
      - run: python -m unittest discover -s tests -p test_benchmark_data_policy.py -v
